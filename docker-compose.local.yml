services:
  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py migrate &&
            python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      - SQLITE_PATH=/app/data/db.sqlite3
      - APP_DATA_DIR=/app/data
    volumes:
      - ./static:/app/static
      - ./data:/app/data
    ports:
      - "8000:8000"

