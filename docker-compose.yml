services:
  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py collectstatic --noinput &&
         python manage.py migrate &&
         gunicorn airbnb_prediction.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile -"
    env_file:
      - .env
    environment:
      - SQLITE_PATH=/app/data/db.sqlite3
      - APP_DATA_DIR=/app/data
    volumes:
      - ./static:/app/static
      - ./data:/app/data
    expose:
      - "8000"
    networks:
      default:
      proxy:
        aliases:
          - airbnb-web


networks:
  proxy:
    external: true