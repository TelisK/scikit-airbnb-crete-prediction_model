<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
</head>

<body>
    <h1>HOME</h1>
    <a href="{% url 'price_prediction:analyse_data' %}"><button>Νέα Καταχώρηση listing</button></a>

    <div id="map" style="height: 400px"></div>

    <div class="user-form">
        <form method="GET">
            <!-- {% csrf_token %} -->
            <div class="standard-form">
                <label>Συντεταγμένες</label>
                <!-- step="any" is used to allow any float. This is helpful for coordinates -->
                <input placeholder="35.513830" type="number" step="any" id="user_latitude" name="user_latitude" value="{{ values.user_latitude }}" required>
                <input placeholder="24.020390" type="number" step="any" id="user_longitude" name="user_longitude" value="{{ values.user_longitude }}" required>
            </div>
            <div class="standard-form">
                <label>Διαθέσιμα Κρεβάτια</label>
                <input type="number" name="user_beds" value="{{ values.user_beds }}" required>
            </div>
            <div class="standard-form">
                <label>Φιλοξενεί</label>
                <input type="number" name="user_accommodates" value="{{ values.user_accommodates }}" required>
            </div>
            <div class="standard-form">
                <label>Ελάχιστος αριθμός διανυκτερεύσεων</label>
                <input type="number" name="user_minimum_nights" value="{{ values.user_minimum_nights }}" required>
            </div>
            <div class="standard-form">
                <label>Πισίνα</label>
                <input type="checkbox" name="user_has_pool" value="1" {% if values.user_has_pool %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Θέα θάλασσα</label>
                <input type="checkbox" name="user_has_seaview" value="1" {% if values.user_amenities_has_seaview %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Θέα βουνό</label>
                <input type="checkbox" name="user_has_mountain_view" value="1" {% if values.user_has_mountain_view %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Αir condition</label>
                <input type="checkbox" name="user_has_air_condition" value="1" {% if values.user_has_air_condition %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Δωρεάν Πάρκινκ</label>
                <input type="checkbox" name="user_has_free_parking" value="1" {% if values.user_has_free_parking %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Κουζίνα</label>
                <input type="checkbox" name="user_has_kitchen" value="1" {% if values.user_has_kitchen %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Χρηματοκιβώτιο</label>
                <input type="checkbox" name="user_has_safe" value="1" {% if values.user_has_safe %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Ζεστό νερό</label>
                <input type="checkbox" name="user_has_hot_water" value="1" {% if values.user_has_hot_water %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Πιστολάκι μαλλιών</label>
                <input type="checkbox" name="user_has_hair_dryer" value="1" {% if values.user_has_hair_dryer %}checked{% endif %}>
            </div>

            <div class="standard-form">
                <label>Τζάκι</label>
                <input type="checkbox" name="user_has_fireplace" value="1" {% if values.user_has_fireplace %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Βίλλα</label>
                <input type="checkbox" name="user_is_villa" value="1" {% if values.user_is_villa %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Είναι στην Παλιά Πόλη</label>
                <input type="checkbox" name="user_is_in_old_town" value="1" {% if values.user_is_in_old_town %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Ολόκληρο διαμέρισμα/σπίτι</label>
                <input type="checkbox" name="user_entire_place" value="1" {% if values.user_entire_place %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Ενοικίαση δωματίου σε σπίτι</label>
                <input type="checkbox" name="user_private_room" value="1" {% if values.user_private_room %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Ενοικίαση κοινόχρηστου δωματίου</label>
                <input type="checkbox" name="user_shared_room" value="1" {% if values.user_shared_room %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Τροχόσπιτο/Container/Σκηνή/Σκάφος κλπ</label>
                <input type="checkbox" name="user_alternative" value="1" {% if values.user_alternative %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Πολυτελείας</label>
                <input type="checkbox" name="user_luxury" value="1" {% if values.user_luxury %}checked{% endif %}>
            </div>
            <div class="standard-form">
                <label>Δωμάτιο ξενοδοχείου</label>
                <input type="checkbox" name="user_hotel_room" value="1" {% if values.user_hotel_room %}checked{% endif %}>
            </div>

            <button type="submit">Πρόβλεψη</button>
        </form>
    </div>

    <div class="prediction-result">
        {{ prediction }}
    </div>



    {% if messages %}
    <div class="message-container">
        {% for message in messages %}
        <div class="alert alert-message-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    </div>
    <div>
        {{ form.errors }}
    </div>

    <script>
        // https://openfreemap.org/quick_start/

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/liberty',
            center: [24.81, 35.30],   // [lng, lat] — Κρήτη
            zoom: 8,
        });

        let marker = null;
        map.on('click', (e) => {
            const lat = e.lngLat.lat.toFixed(6);
            const lng = e.lngLat.lng.toFixed(6);
            document.getElementById('user_latitude').value = lat;
            document.getElementById('user_longitude').value = lng;
            if (marker) { marker.setLngLat(e.lngLat); }
            else { marker = new maplibregl.Marker().setLngLat(e.lngLat).addTo(map); }
        });
        map.on('load', () => {
    showPoint(
        parseFloat(document.getElementById('user_latitude').value),
        parseFloat(document.getElementById('user_longitude').value)
    );
});
    </script>
</body>

</html>
