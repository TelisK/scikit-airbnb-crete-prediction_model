<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>MODEL TRAIN</h1>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">ΕΚΠΑΙΔΕΥΣΗ</button>
    </form>
    

            {% if messages %}
        <div class="message-container">
            {% for message in messages %}
            <div class="alert alert-message-{{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>
    <div>
        {{ form.errors }}
    </div>
</body>
</html>
